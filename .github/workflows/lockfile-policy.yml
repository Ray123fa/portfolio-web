name: Lockfile Policy

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  enforce-lockfile-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enforce npm lockfile policy
        run: npm run check:lockfile-policy
